# Redirect ds2.app.local to ds2.kimmeloffice.com
server {
    listen 80;
    listen 443 ssl;
    server_name ds2.app.local;

    ssl_certificate /etc/nginx/ssl/ds2.app.local.crt;
    ssl_certificate_key /etc/nginx/ssl/ds2.app.local.key;

    return 301 https://ds2.kimmeloffice.com$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name ds2.kimmeloffice.com pipelines.app.local;
    return 301 https://$host$request_uri;
}

# DS2 Secure server block
server {
    listen 443 ssl;
    server_name ds2.kimmeloffice.com;

    ssl_certificate /etc/nginx/ssl/ds2.kimmeloffice.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ds2.kimmeloffice.com.key;

    # Timesheet/template XLSX uploads exceed nginx's 1m default body cap —
    # without this they die at the edge with 413 before reaching the API.
    client_max_body_size 25m;

    # Compress API JSON and app assets (grids/blob responses are large and
    # highly compressible). Static gzip of the JS bundle is handled by the
    # frontend serve layer; this covers the proxied responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Security headers (defense-in-depth at the TLS edge).
    # `always` makes them apply to error responses (4xx/5xx) too.
    # NOTE on inheritance: nginx `add_header` in a `location` REPLACES (does not
    # merge with) these server-level headers. None of the `location` blocks below
    # declare their own add_header, so these are inherited everywhere. If you ever
    # add an add_header inside a location, you MUST re-declare these there too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP is intentionally minimal at the edge: the React app is served by a
    # separate `serve` layer that already sets a full CSP (frontend serve.json)
    # for the static assets, and the API returns JSON. A broad edge CSP would
    # conflict with the app-layer policy, so we only enforce clickjacking
    # protection here as a backstop (mirrors X-Frame-Options: DENY).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # If you later want the edge to own the full policy, replace the line above
    # with a stricter directive coordinated with the frontend serve.json, e.g.:
    # add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location / {
        proxy_pass http://localhost:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sockjs-node {
        proxy_pass http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /ds2_backend {
        rewrite /ds2_backend/(.*) /$1 break;
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Notes (Python FastAPI) routed under /mcp_notes
    # Normalizes /mcp_notes to /mcp_notes/
    location = /mcp_notes {
        return 301 /mcp_notes/;
    }

    # Proxies /mcp_notes/* to the mcp-notes container on port 8080 (DISABLED - service not deployed)
    # location /mcp_notes/ {
    #     # strip the prefix so FastAPI receives /mcp, /healthz, etc.
    #     rewrite ^/mcp_notes/(.*)$ /$1 break;
    #     proxy_pass http://localhost:8095;
    #
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Authorization $http_authorization;
    #
    #     # allow larger payloads if needed (JSON tool calls)
    #     client_max_body_size 10m;
    # }
}

# Jenkins Secure server block
server {
    listen 443 ssl;
    server_name pipelines.app.local;

    ssl_certificate /etc/nginx/ssl/pipelines.app.local.crt;
    ssl_certificate_key /etc/nginx/ssl/pipelines.app.local.key;

    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Security headers (defense-in-depth). `always` covers error responses too.
    # No location below declares its own add_header, so these inherit cleanly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        proxy_pass http://192.168.6.233:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
